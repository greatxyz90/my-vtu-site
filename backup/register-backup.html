<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Glory VTU Register</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Glory VTU Register</h1>
<input type="email" id="email" placeholder="Enter Email"><br>
<input type="password" id="password" placeholder="Enter Password"><br>
<button id="registerBtn">Register</button>
<p id="message"></p>
<p>Already have an account? <a href="index.html">Login</a></p>
<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
document.getElementById("registerBtn").addEventListener("click", async ()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email||!password){alert("Enter email & password");return;}
  try{
    const userCredential=await createUserWithEmailAndPassword(auth,email,password);
    await setDoc(doc(db,"users",userCredential.user.uid),{email:email,balance:5000});
    await sendEmailVerification(userCredential.user);
    document.getElementById("message").textContent="✅ Account created! Check email to verify.";
  }catch(error){document.getElementById("message").textContent="❌ "+error.message;}
});
</script>
</body>
</html>
