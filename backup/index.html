<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Glory VTU Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Glory VTU Login</h1>
<input type="email" id="email" placeholder="Enter Email"><br>
<input type="password" id="password" placeholder="Enter Password"><br>
<button id="loginBtn">Login</button>
<p><a href="#" id="forgotPasswordLink">Forgot Password?</a></p>
<p id="message"></p>
<p>No account? <a href="register.html">Register</a></p>
<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();
  if(!email||!password){ alert("Enter email & password"); return; }
  try {
    const userCredential = await signInWithEmailAndPassword(auth,email,password);
    if(!userCredential.user.emailVerified){ alert("Please verify your email first."); window.location.href="verify.html"; return; }
    window.location.href="dashboard.html";
  } catch(error){ document.getElementById("message").textContent="❌ "+error.message; }
});

document.getElementById("forgotPasswordLink").addEventListener("click", async ()=>{
  const email=prompt("Enter your registered email to reset password:").trim();
  if(!email) return;
  try{ await sendPasswordResetEmail(auth,email); alert("✅ Password reset email sent!"); }
  catch(error){ alert("❌ "+error.message); }
});
</script>
</body>
</html>
